  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:    #2a2a2a;
      --cream: #e8ddd4;
      --gold:  #c4a882;
    }

    body {
      background: var(--bg);
      color: var(--cream);
      font-family: 'Raleway', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .logo {
      width: 220px;
      height: 220px;
      object-fit: contain;
      margin-bottom: 2.5rem;
    }

    .name {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      font-weight: 300;
      letter-spacing: 0.08em;
      color: var(--cream);
      margin-bottom: 0.8rem;
    }

    .tagline {
      font-size: 0.8rem;
      font-weight: 400;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 3rem;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: var(--gold);
      margin: 0 auto 3rem;
      opacity: 0.5;
    }

    .wa-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      background: var(--cream);
      color: var(--bg);
      font-family: 'Raleway', sans-serif;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 0.9rem 2rem;
      text-decoration: none;
      transition: background 0.3s;
    }
    .wa-btn:hover { background: var(--gold); }
    .wa-btn svg { flex-shrink: 0; }
  </style>
</head>
